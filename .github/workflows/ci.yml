name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run --with pyyaml==6.0.2 python -m unittest discover -v
      - run: uvx ruff check .
      - run: python -m py_compile nt.py tests/*.py
      - run: make env
      - run: docker compose --env-file docker/.env --profile all --profile test config --quiet
