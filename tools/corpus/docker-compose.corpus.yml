services:
  db:
    volumes:
      - db-data:/var/lib/mysql
      - ${NICTOOL_API_SOURCE}/sql:/sql:ro
      - ${NICTOOL_API_SOURCE}/sql/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh:ro

  api:
    build:
      context: ${NICTOOL_API_SOURCE}
    volumes:
      - ${NICTOOL_API_SOURCE}:/app
      - api_node_modules:/app/node_modules
      - ${NICTOOL_VALIDATE_SOURCE}:/app/node_modules/@nictool/validate
      - ${NICTOOL_DNS_RESOURCE_RECORD_SOURCE}:/app/node_modules/@nictool/dns-resource-record

  root-user-init:
    volumes:
      - ${NICTOOL_API_SOURCE}:/app
      - api_node_modules:/app/node_modules
      - ${NICTOOL_VALIDATE_SOURCE}:/app/node_modules/@nictool/validate

  nictool-legacy:
    build:
      context: ${NICTOOL_LEGACY_SOURCE}
    volumes:
      - ${NICTOOL_LEGACY_SOURCE}/server:/usr/local/nictool/server
      - ${NICTOOL_LEGACY_SOURCE}/client:/usr/local/nictool/client
      - ${NICTOOL_LEGACY_SOURCE}/dist:/usr/local/nictool/dist:ro
    environment:
      NICTOOL_DB_NAME: ${NICTOOL_DB_NAME:-nictool_corpus}
      NICTOOL_TEST_ENV: "1"
