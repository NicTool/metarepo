services:
  # ── Shared database ──────────────────────────────────────────────
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${NICTOOL_DB_NAME:-nictool}
      MYSQL_USER: ${NICTOOL_DB_USER:-nictool}
      MYSQL_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      SQL_DIR: /sql
    volumes:
      - db-data:/var/lib/mysql
      - ./api/sql:/sql:ro
      - ./api/sql/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js v3 API ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NICTOOL_DB_HOST: db
      NICTOOL_DB_USER: ${NICTOOL_DB_USER:-nictool}
      NICTOOL_DB_USER_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      NICTOOL_DB_NAME: ${NICTOOL_DB_NAME:-nictool}
      NICTOOL_HTTP_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/documentation').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Node.js v3 Web UI ───────────────────────────────────────────
  server:
    profiles: [ui, e2e, all]
    build:
      context: ./server
      dockerfile: docker/Dockerfile
    hostname: localhost
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_CONTAINER_PORT:-8080}"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      NICTOOL_TLS: ${NICTOOL_TLS:-false}
      NICTOOL_DB_HOST: db
      NICTOOL_DB_USER: ${NICTOOL_DB_USER:-nictool}
      NICTOOL_DB_USER_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      NICTOOL_DB_NAME: ${NICTOOL_DB_NAME:-nictool}
      NICTOOL_API_HOST: api
      NICTOOL_API_PORT: 3000
      NICTOOL_BIND_HOST: "0.0.0.0"

  # ── Legacy Perl NicTool v2 ──────────────────────────────────────
  nictool-legacy:
    profiles: [legacy, all]
    build:
      context: ./NicTool
      dockerfile: dist/docker/Dockerfile
    ports:
      - "${LEGACY_HTTP_PORT:-8082}:80"
      - "${LEGACY_HTTPS_PORT:-8443}:443"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./NicTool/server:/usr/local/nictool/server
      - ./NicTool/client:/usr/local/nictool/client
      - ./NicTool/dist:/usr/local/nictool/dist:ro
    env_file: docker/.env
    environment:
      DB_ENGINE: mysql
      DB_HOSTNAME: db
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost/index.cgi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  api_node_modules:
  server_node_modules:
