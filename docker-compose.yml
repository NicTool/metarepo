services:
  # ── Shared database ──────────────────────────────────────────────
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${NICTOOL_DB_NAME:-nictool}
      MYSQL_USER: ${NICTOOL_DB_USER:-nictool}
      MYSQL_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      SQL_DIR: /sql
    volumes:
      - db-data:/var/lib/mysql
      - ./api/sql:/sql:ro
      - ./api/sql/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js v3 API ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      # the manifest's validate checkout, not whatever npm resolved
      - ./libs/validate:/app/node_modules/@nictool/validate
    environment:
      NODE_ENV: development
      NICTOOL_DB_HOST: db
      NICTOOL_DB_USER: ${NICTOOL_DB_USER:-nictool}
      NICTOOL_DB_USER_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      NICTOOL_DB_NAME: ${NICTOOL_DB_NAME:-nictool}
      NICTOOL_HTTP_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/documentation').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api-stress:
    profiles: [stress]
    image: ${STRESS_API_IMAGE:-nictool-api-stress:node-24}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./libs/validate:/app/node_modules/@nictool/validate:ro
    environment:
      NODE_ENV: development
      NICTOOL_DB_HOST: db
      NICTOOL_DB_USER: ${NICTOOL_DB_USER:-nictool}
      NICTOOL_DB_USER_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      NICTOOL_DB_NAME: ${NICTOOL_DB_NAME:-nictool}
    command: ["npm", "test"]

  root-user-init:
    profiles: [legacy, all]
    image: node:22-trixie-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - ./libs/validate:/app/node_modules/@nictool/validate
      - ./docker/seed-root-user.mjs:/init/seed-root-user.mjs:ro
    env_file: docker/.env
    environment:
      NICTOOL_DATA_STORE: mysql
      NICTOOL_DB_HOST: db
      NICTOOL_DB_USER: ${NICTOOL_DB_USER:-nictool}
      NICTOOL_DB_USER_PASSWORD: ${NICTOOL_DB_USER_PASSWORD}
      NICTOOL_DB_NAME: ${NICTOOL_DB_NAME:-nictool}
    command: ["node", "/init/seed-root-user.mjs"]

  # ── Node.js v3 Web UI ───────────────────────────────────────────
  server:
    profiles: [ui, e2e, all]
    build:
      context: ./server
      dockerfile: docker/Dockerfile
    hostname: localhost
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_CONTAINER_PORT:-8080}"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - server-data:/data
    environment:
      NICTOOL_TLS: ${NICTOOL_TLS:-false}
      NICTOOL_API_HOST: api
      NICTOOL_API_PORT: 3000
      NICTOOL_API_SCHEME: http
      NICTOOL_BIND_HOST: "0.0.0.0"
      NICTOOL_HTTP_PORT: ${SERVER_CONTAINER_PORT:-8080}
      NICTOOL_TEST_DSN: mysql://${NICTOOL_DB_USER:-nictool}:${NICTOOL_DB_USER_PASSWORD}@db:3306/${NICTOOL_DB_NAME:-nictool}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${SERVER_CONTAINER_PORT:-8080}/nt/service').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Legacy Perl NicTool v2 ──────────────────────────────────────
  nictool-legacy:
    profiles: [legacy, all]
    build:
      context: ./NicTool
      dockerfile: dist/docker/Dockerfile
    ports:
      - "${LEGACY_HTTP_PORT:-8082}:80"
      - "${LEGACY_HTTPS_PORT:-8443}:443"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      root-user-init:
        condition: service_completed_successfully
    volumes:
      - ./NicTool/server:/usr/local/nictool/server
      - ./NicTool/client:/usr/local/nictool/client
      - ./NicTool/dist:/usr/local/nictool/dist:ro
    env_file: docker/.env
    environment:
      DB_ENGINE: mysql
      DB_HOSTNAME: db
      DB_PORT: "3306"
      # the v2 GUI talks to the v3 api; SOAP test targets set their own env
      NICTOOL_DATA_PROTOCOL: ${NICTOOL_DATA_PROTOCOL:-rest}
      NICTOOL_SERVER_HOST: ${NICTOOL_SERVER_HOST:-api}
      NICTOOL_SERVER_PORT: ${NICTOOL_SERVER_PORT:-3000}
      NICTOOL_TEST_ENV: "1"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost/index.cgi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  v2-e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    depends_on:
      nictool-legacy:
        condition: service_healthy
    init: true
    ipc: host
    working_dir: /work
    volumes:
      - ./NicTool/client/t/e2e:/work
      - v2_e2e_node_modules:/work/node_modules
    environment:
      NICTOOL_URL: https://nictool-legacy
    command: ["sh", "-c", "npm ci && npm test"]

volumes:
  db-data:
  api_node_modules:
  server-data:
  server_node_modules:
  v2_e2e_node_modules:
